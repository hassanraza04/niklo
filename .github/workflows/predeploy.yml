name: Pre-deploy checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Data guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install pipeline dependencies
        run: uv sync --project pipeline --frozen
      - name: Run pipeline unit tests
        run: uv run --project pipeline python -m unittest discover -s tests -v
      - name: Check generated D1 seed
        run: uv run --project pipeline python pipeline/seed_checks.py
      - name: Check customer flows
        run: uv run --project pipeline python pipeline/customer_flow_checks.py
      - name: Verify live listing lock can be regenerated
        run: uv run --project pipeline python pipeline/export_live_listings.py --output /tmp/live_listings.csv
      - name: Verify release lock
        run: uv run --project pipeline python pipeline/release_checks.py

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate static catalog
        run: python ../pipeline/export_catalog.py --server-output data/catalog.json --client-output public/catalog-client.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
